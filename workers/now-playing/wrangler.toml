name = "hive-fm-now-playing"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Create with: npx wrangler kv namespace create NOW_PLAYING
# then paste the returned id below.
[[kv_namespaces]]
binding = "NOW_PLAYING"
id = "69be8952feba40078ee03189ecc58816"

[vars]
# Comma-separated origins allowed to read /now-playing from a browser
ALLOWED_ORIGINS = "https://hivefm.vercel.app,http://localhost:3000"

# PUSH_TOKEN is a secret: npx wrangler secret put PUSH_TOKEN
